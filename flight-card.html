<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>航班信息卡片 - 7步教程实现</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 40px;
    }

    /* ===== Step 1: 卡片底板 ===== */
    .flight-card {
      position: relative;
      width: 520px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      border-radius: 28px;
      padding: 32px;
      /* 多层内阴影模拟边缘高光和深度 */
      box-shadow:
        /* 白色高光 - 顶部和左右 */
        inset 0 2px 4px rgba(255,255,255,0.15),
        inset 2px 0 3px rgba(255,255,255,0.08),
        inset -2px 0 3px rgba(255,255,255,0.08),
        /* 底部深色阴影 */
        inset 0 -3px 6px rgba(0,0,0,0.5),
        /* 外部悬浮阴影 */
        0 20px 60px rgba(0,0,0,0.3),
        0 8px 24px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    /* ===== Step 3: 底纹细节 ===== */
    .flight-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60%;
      background:
        radial-gradient(circle at 20% 30%, rgba(160,255,100,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(160,255,100,0.04) 0%, transparent 40%);
      pointer-events: none;
      border-radius: 28px;
    }

    /* 点状底纹 */
    .flight-card::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 16px;
      width: 120px;
      height: 80px;
      background-image: radial-gradient(circle, rgba(160,255,100,0.15) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
      border-radius: 12px;
    }

    /* ===== Step 2: 布局排版 ===== */
    .card-content {
      position: relative;
      z-index: 2;
    }

    .flight-info {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .airport {
      text-align: center;
    }

    .airport-code {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
    }

    .airport-city {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
    }

    .airport-time {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: rgba(160,255,100,0.15);
      border-radius: 50%;
      margin-top: -8px;
    }

    .arrow svg {
      width: 16px;
      height: 16px;
      color: #a0ff64;
    }

    /* 右侧 ETA 信息 */
    .eta-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px 20px;
      min-width: 140px;
    }

    .eta-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .eta-time {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .eta-icon {
      width: 24px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eta-icon svg {
      width: 12px;
      height: 12px;
      color: rgba(255,255,255,0.6);
    }

    .eta-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    .eta-status {
      font-size: 13px;
      font-weight: 600;
      color: #a0ff64;
    }

    /* ===== Step 4 & 5: 进度条底框 + 进度条 ===== */
    .progress-wrapper {
      position: relative;
      height: 52px;
      background: linear-gradient(180deg, #15130e 0%, #0c0b08 100%);
      border-radius: 18px;
      padding: 7px;
      /* 多层内阴影模拟凹槽深度 */
      box-shadow:
        inset 0 3px 10px rgba(0,0,0,0.7),
        inset 0 1px 3px rgba(255,255,255,0.04),
        0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    /* 进度条轨道 */
    .progress-track {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      overflow: hidden;
      z-index: 2;
    }

    /* 白色进度填充 */
    .progress-fill {
      position: relative;
      width: 62%;
      height: 100%;
      background: linear-gradient(90deg, #f5efe6 0%, #ffffff 45%, #fffefc 100%);
      border-radius: 14px;
      box-shadow:
        0 0 16px rgba(255,255,255,0.25),
        0 0 32px rgba(255,240,200,0.15);
    }

    /* ===== Step 6: 灵魂光效（3个椭圆堆叠） ===== */
    .glow-effects {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      border-radius: 18px;
    }

    /* 底部椭圆：最宽的基础发光层，暖橙色，screen模式，50%不透明度 */
    .glow-bottom {
      position: absolute;
      bottom: -60%;
      left: 50%;
      transform: translateX(-50%);
      width: 110%;
      height: 180%;
      background: radial-gradient(ellipse at center, rgba(255, 161, 103, 0.9) 0%, rgba(255, 140, 60, 0.4) 30%, transparent 70%);
      filter: blur(24px);
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    /* 左边椭圆：偏黄色，soft-light模式，100%不透明度 */
    .glow-left {
      position: absolute;
      left: -10%;
      top: 60%;
      transform: translateY(-50%);
      width: 55%;
      height: 160%;
      background: radial-gradient(ellipse at center, rgba(255, 214, 126, 0.85) 0%, rgba(255, 200, 80, 0.35) 35%, transparent 70%);
      filter: blur(20px);
      mix-blend-mode: soft-light;
    }

    /* 右边椭圆：深橙色，overlay模式，100%不透明度 */
    .glow-right {
      position: absolute;
      right: 15%;
      top: 55%;
      transform: translateY(-50%);
      width: 50%;
      height: 150%;
      background: radial-gradient(ellipse at center, rgba(255, 149, 0, 0.9) 0%, rgba(255, 130, 20, 0.4) 30%, transparent 70%);
      filter: blur(22px);
      mix-blend-mode: overlay;
    }

    /* ===== Step 7: 小飞机 Icon ===== */
    .plane-icon {
      position: absolute;
      right: 33%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
    }

    .plane-icon svg {
      width: 18px;
      height: 18px;
      color: rgba(30, 25, 15, 0.7);
      filter: drop-shadow(0 1px 1px rgba(255,255,255,0.4));
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .flight-card { width: 100%; padding: 24px; }
      .airport-code { font-size: 28px; }
      .eta-box { padding: 12px 16px; min-width: auto; }
    }
  </style>
</head>
<body>

  <!-- 航班信息卡片 -->
  <div class="flight-card">
    <div class="card-content">
      <!-- 航班信息 -->
      <div class="flight-info">
        <div class="route">
          <div class="airport">
            <div class="airport-code">YYZ</div>
            <div class="airport-city">Toronto</div>
            <div class="airport-time">MON, 6:10 PM</div>
          </div>
          <div class="arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
          <div class="airport">
            <div class="airport-code">HND</div>
            <div class="airport-city">Tokyo</div>
            <div class="airport-time">TUE, 7:20 AM</div>
          </div>
        </div>

        <!-- ETA -->
        <div class="eta-box">
          <div class="eta-header">
            <span class="eta-time">ETA 2:10 PM</span>
            <div class="eta-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"></polyline>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <polyline points="7 23 3 19 7 15"></polyline>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
              </svg>
            </div>
          </div>
          <div class="eta-label">Tokyo Time</div>
          <div class="eta-status">DINNER IN 2:40H</div>
        </div>
      </div>

      <!-- 进度条 -->
      <div class="progress-wrapper">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <!-- 光效层 -->
        <div class="glow-effects">
          <div class="glow-bottom"></div>
          <div class="glow-left"></div>
          <div class="glow-right"></div>
        </div>
        <!-- 飞机图标 -->
        <div class="plane-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
